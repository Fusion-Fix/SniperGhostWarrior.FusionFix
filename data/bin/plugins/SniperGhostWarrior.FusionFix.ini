[Display]
DisplayMode = 0                 // (0) fullscreen, (1) windowed.
InternalResolutionX = 0         // Sets the internal game ResX without it affecting the window resolution, useful for supersampling and downscaling. Range: 320 - 16384
InternalResolutionY = 0         // Sets the internal game ResY without it affecting the window resolution, useful for supersampling and downscaling. Range: 240 - 16384
ScalingFilter = 1               // Internal resolution scaling filter: (0) point, (1) bilinear.
VSync = 1                       // (0) off, (1) on.
MaxFrameRate = 1                // Frame rate cap: (0) uncapped, (1) the rate the display is running at, range: 10 - 1000

[Graphics]
AnisotropicFiltering = 16       // Forces the selected AF level, range: 2 to 16.

[Gameplay]
NoDetectionIndicator = 0        // Removes the detection indicator: (0) default, (1) disabled.
NoWaypointMarker = 0            // Removes the world markers pointing at objectives: (0) default, (1) disabled.

[FieldOfView]
FieldOfView = 91.35             // The player camera's horizontal FOV in degrees, range: 45 to 140. Does not affect scopes or cutscenes.

[General]
SkipIntro = 1                   // Skips the publisher logo, the intro movie and the "press start" screen, booting straight to the main menu.
SkipPressAnyKey = 1             // Skips the "press any key" prompt shown once a level has finished loading.
