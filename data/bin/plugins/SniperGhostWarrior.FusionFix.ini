[Display]
DisplayMode = 0                 // Window mode, overriding what Video.scr says: (0) the game's own setting, (1) fullscreen, (2) windowed.
VSync = 0                       // Vertical sync, overriding what Video.scr says: (0) the game's own setting, (1) off, (2) on.

[Graphics]
AnisotropicFiltering = 16       // Forces the selected AF level on every filtered sampler, range 2 to 16. 0 leaves the per-material defaults, which are trilinear at 1x. The game's own Filtering option is parsed and then never read.

[FieldOfView]
FieldOfView = 91.35             // The player camera's vertical FOV in degrees, range 45 to 140. The horizontal angle follows the display's aspect on its own. Does not affect ironsights, scopes or cutscenes.

[General]
SkipIntro = 1                   // Skips the publisher logo, the intro movie and the "press start" screen, booting straight to the main menu.
SkipPressAnyKey = 1             // Skips the "press any key" prompt shown once a level has finished loading.
